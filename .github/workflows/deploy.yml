name: Deploy Frontend to Production

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: "Enter the S3 bucket name"
        required: true
        type: string
      distribution_id:
        description: "Leave blank to auto-fetch from config.json or enter manually"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------
      # Checkout
      # --------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # --------------------
      # Install & Build
      # --------------------
      - name: Install Dependencies
        run: npm install

      - name: Build App
        run: npm run build

      # --------------------
      # Detect Build Folder (NON-STRICT)
      # --------------------
      - name: Detect build output directory dynamically
        id: detect_build
        run: |
          echo "🔍 Detecting build output directory..."

          # List directories sorted by last modified time (newest first)
          BUILD_DIR=$(ls -td */ | head -n 1 | tr -d '/')

          if [ -z "$BUILD_DIR" ]; then
            echo "❌ No directory detected"
            exit 1
          fi

          echo "✅ Detected build directory: $BUILD_DIR"
          ls -la "$BUILD_DIR"

          echo "build_dir=$BUILD_DIR" >> $GITHUB_OUTPUT

      # --------------------
      # OIDC Debug (optional, safe)
      # --------------------
      - name: Debug AWS OIDC Token
        run: |
          curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value' \
          | cut -d '.' -f2 \
          | base64 --decode \
          | jq '.'

      # --------------------
      # Configure AWS
      # --------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::326148035143:role/github-deploy-role
          aws-region: ap-south-1
          audience: sts.amazonaws.com

      # --------------------
      # Validate S3 Bucket
      # --------------------
      - name: Validate S3 Bucket
        run: |
          BUCKET="${{ github.event.inputs.bucket_name }}"
          echo "Validating bucket: $BUCKET"
          if ! aws s3 ls "s3://$BUCKET" >/dev/null 2>&1; then
            echo "❌ Bucket $BUCKET does not exist"
            exit 1
          fi

      # --------------------
      # Install jq
      # --------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # --------------------
      # Fetch CloudFront ID
      # --------------------
      - name: Fetch CloudFront ID from config.json if not provided
        id: fetch_cf
        run: |
          BUCKET="${{ github.event.inputs.bucket_name }}"
          DISTRIBUTION_ID="${{ github.event.inputs.distribution_id }}"

          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "Fetching CloudFront ID from config.json..."

            if [ ! -f config.json ]; then
              echo "❌ config.json not found"
              exit 1
            fi

            jq -e . config.json > /dev/null || {
              echo "❌ Invalid JSON in config.json"
              exit 1
            }

            DISTRIBUTION_ID=$(jq -er --arg bucket "$BUCKET" '.[$bucket].distribution' config.json) || {
              echo "❌ No CloudFront distribution found for bucket: $BUCKET"
              exit 1
            }
          fi

          echo "✅ Using CloudFront Distribution ID: $DISTRIBUTION_ID"
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT

      # --------------------
      # Deploy to S3
      # --------------------
      - name: Deploy detected build directory to S3
        run: |
          BUCKET="${{ github.event.inputs.bucket_name }}"
          BUILD_DIR="${{ steps.detect_build.outputs.build_dir }}"

          echo "🚀 Deploying $BUILD_DIR to bucket: $BUCKET"

          aws s3 sync "./$BUILD_DIR" "s3://$BUCKET" \
            --delete \
            --cache-control "max-age=0, no-cache, no-store, must-revalidate"

      # --------------------
      # CloudFront Invalidation
      # --------------------
      - name: Invalidate CloudFront
        if: ${{ steps.fetch_cf.outputs.distribution_id != '' }}
        run: |
          DISTRIBUTION_ID="${{ steps.fetch_cf.outputs.distribution_id }}"
          echo "♻️ Invalidating CloudFront distribution: $DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
